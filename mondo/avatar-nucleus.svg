<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Nucleo dell'Orchestratore">
  <title>Nucleo dell'Orchestratore</title>
  <!--
    Avatar predefinito dell'Orchestratore: un nucleo dorato che tiene insieme
    le orbite degli specialisti, coi colori delle sei stanze del mondo.
    Nessun collegamento esterno e nessun font: si disegna anche senza internet.
  -->
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="75%">
      <stop offset="0%"   stop-color="#1a2742"/>
      <stop offset="65%"  stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="nucleo" cx="38%" cy="34%" r="70%">
      <stop offset="0%"   stop-color="#fff3d2"/>
      <stop offset="45%"  stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#c07d16"/>
    </radialGradient>
    <radialGradient id="alone" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f5b942" stop-opacity=".55"/>
      <stop offset="55%"  stop-color="#f5b942" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" fill="url(#fondo)"/>
  <circle cx="128" cy="128" r="104" fill="url(#alone)"/>

  <!-- orbite: i percorsi lungo cui si muovono gli specialisti -->
  <g fill="none" stroke="#f5b942" stroke-opacity=".30" stroke-width="1.6">
    <ellipse cx="128" cy="128" rx="86" ry="34"/>
    <ellipse cx="128" cy="128" rx="86" ry="34" transform="rotate(60 128 128)"/>
    <ellipse cx="128" cy="128" rx="86" ry="34" transform="rotate(120 128 128)"/>
  </g>

  <!-- gli specialisti in orbita, uno per stanza -->
  <g stroke="#0a1020" stroke-width="2.5">
    <circle cx="214" cy="128" r="9"   fill="#5ac8fa"/>
    <circle cx="171" cy="203" r="9"   fill="#7ee787"/>
    <circle cx="85"  cy="203" r="9"   fill="#c792ea"/>
    <circle cx="42"  cy="128" r="9"   fill="#ff9f6b"/>
    <circle cx="85"  cy="53"  r="9"   fill="#4fd1c5"/>
    <circle cx="171" cy="53"  r="9"   fill="#ff7b9c"/>
  </g>

  <!-- i fili di comando: tutto passa dal centro -->
  <g stroke="#f5b942" stroke-opacity=".22" stroke-width="1.4">
    <line x1="128" y1="128" x2="214" y2="128"/>
    <line x1="128" y1="128" x2="171" y2="203"/>
    <line x1="128" y1="128" x2="85"  y2="203"/>
    <line x1="128" y1="128" x2="42"  y2="128"/>
    <line x1="128" y1="128" x2="85"  y2="53"/>
    <line x1="128" y1="128" x2="171" y2="53"/>
  </g>

  <!-- il nucleo -->
  <circle cx="128" cy="128" r="40" fill="#0a1020" opacity=".85"/>
  <circle cx="128" cy="128" r="34" fill="url(#nucleo)"/>
  <circle cx="128" cy="128" r="34" fill="none" stroke="#fff3d2" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="116" cy="115" r="9"  fill="#fffaf0" opacity=".45"/>

  <!-- la corona: chi coordina -->
  <path d="M104 78 L114 92 L128 74 L142 92 L152 78 L148 100 L108 100 Z"
        fill="#f5b942" stroke="#0a1020" stroke-width="2" stroke-linejoin="round"/>
</svg>
